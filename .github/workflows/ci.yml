name: Java CI for Tomcat App

on:
  push:
    branches:
      - feature/secure-ci-app    


concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  build_and_test:
    name: Build WAR & Run Tests (Java 11, Tomcat-ready)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EFE-Capstone-Src

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'  

     
      - name: Validate Maven config
        run: mvn -B validate --no-transfer-progress
      

      - name: Build WAR package
        run: mvn -B clean package --no-transfer-progress

      
      - name: Run tests
        run: mvn -B test --no-transfer-progress

    
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomcat-war-package
          path: EFE-Capstone-Src/target/*.war
