name: Java CI for Tomcat App

on:
  push:
    branches:
      - feature/secure-ci-app

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build WAR & Run Tests (Java 11, Tomcat-ready)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sourcecodeseniorwr

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "maven"

      - name: Validate Maven config
        run: mvn -B validate --no-transfer-progress

      - name: Build WAR package
        run: mvn -B clean package --no-transfer-progress

      - name: Run tests
        run: mvn -B test --no-transfer-progress

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomcat-war-package
          path: sourcecodeseniorwr/target/*.war

      # SECURITY SCAN with Trivy
      - name: Run Trivy Vulnerability Scan on Artifact
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: sourcecodeseniorwr/target
          vuln-type: os,library
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # Build Docker Image for Tomcat App
      - name: Build Docker Image
        working-directory: ${{ github.workspace }}
        run: docker build -t tomcat-app -f Dockerfile .

      - name: Notify only on failure
        if: failure()
        run: echo "Build failed"
